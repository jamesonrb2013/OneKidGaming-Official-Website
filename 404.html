<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <meta name="description" content="Page not found. Return to OneKidGaming and get back in the game.">
  <meta property="og:title" content="Page Not Found | OneKidGaming">
  <meta property="og:description" content="Looks like you took a wrong turn in the game.">
  <title>404 — Page Not Found | OneKidGaming</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b14;
      --panel: rgba(17, 24, 43, .82);
      --text: #f4f7ff;
      --muted: #a7b1c8;
      --cyan: #55e6ff;
      --purple: #9b7bff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 28px 18px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 18% 18%, rgba(85,230,255,.13), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(155,123,255,.16), transparent 42%),
        linear-gradient(145deg, #080b14 0%, #0c1222 52%, #090b16 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .19;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    .card {
      position: relative;
      width: min(100%, 700px);
      padding: clamp(30px, 7vw, 66px) clamp(22px, 7vw, 66px);
      text-align: center;
      border: 1px solid rgba(157, 180, 255, .19);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 28px 100px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.055);
      backdrop-filter: blur(14px);
      animation: rise .65s ease-out both;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
      color: #eaf5ff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgba(85,230,255,.6);
      border-radius: 9px;
      color: var(--cyan);
      box-shadow: 0 0 22px rgba(85,230,255,.17);
      font-size: 17px;
    }
    .code {
      margin: 0;
      color: var(--cyan);
      font-size: clamp(88px, 23vw, 154px);
      font-weight: 950;
      line-height: .9;
      letter-spacing: -.085em;
      text-shadow: 0 0 34px rgba(85,230,255,.22);
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.12;
      letter-spacing: -.04em;
    }
    .message {
      max-width: 470px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.7;
    }
    .actions { margin-top: 32px; }
    .home {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 0 25px;
      border: 0;
      border-radius: 13px;
      color: #06101a;
      background: linear-gradient(100deg, var(--cyan), #9beeff);
      box-shadow: 0 9px 30px rgba(85,230,255,.2);
      font-size: 15px;
      font-weight: 850;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .home:hover { transform: translateY(-3px); box-shadow: 0 13px 36px rgba(85,230,255,.3); }
    .home:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .hint {
      margin: 25px 0 0;
      color: #77839e;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) {
      .card { border-radius: 20px; }
      .brand { margin-bottom: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> OneKidGaming</div>
    <p class="code" aria-label="Error 404">404</p>
    <h1>Page Not Found</h1>
    <p class="message">Looks like you took a wrong turn in the game! The page you're looking for may have moved, been removed, or never existed.</p>
    <div class="actions">
      <a class="home" href="https://onekidgaming.com/">Back to OneKidGaming <span aria-hidden="true">↗</span></a>
    </div>
    <p class="hint">Your next adventure starts at home base.</p>
  </main>
</body>
</html>
